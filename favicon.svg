<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5d4" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="26" fill="#030712" />
  <!-- Gradient Border -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.9" />
  <!-- Monogram S -->
  <text x="50" y="55" dominant-baseline="middle" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="58" fill="url(#glowGrad)" filter="url(#shadow)">S</text>
  <!-- Live Pulse Dot -->
  <circle cx="80" cy="20" r="6" fill="#10b981" />
  <circle cx="80" cy="20" r="10" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
</svg>
